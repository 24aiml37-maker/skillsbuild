<html lang="en">
<head>
<title>Roast Toast Coast Cafe</title>
<style>
  body {
    background-color: black;
    font-family: Georgia, 'Times New Roman', serif;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100vh;
  }

  .content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .header-container {
    background: wheat;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    width: 90%;
    box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.7);
    text-align: center;
  }

  /* FIX 2: was "header h1" — no <header> element exists; now targets .header-container h1 */
  .header-container h1 {
    color: #FFCC00;
    font-size: 3em;
    margin: 0 0 10px 0;
    text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
    line-height: 1.2;
  }

  /* FIX 2: was "header p" — corrected to .header-container p */
  .header-container p {
    font-size: 1.3em;
    color: #555555;
    margin: 0;
  }

  .menu-section {
    background-color: #000000;
    color: #FFFFFF;
    padding: 10px;
    margin: 20px 0 20px 10%;
    width: 60%;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(189, 180, 180, 0.7);
    text-align: center;
  }

  .menu-section h2 {
    color: #FFCC00;
    font-size: 2em;
    margin-bottom: 20px;
    cursor: pointer;
    user-select: none;
  }

  /* CSS-only toggle: hide the checkbox, use :checked to show the list */
  #menu-toggle-cb {
    display: none;
  }

  .menu-items {
    list-style-type: none;
    padding: 0;
    display: none; /* hidden by default */
  }

  /* FIX 3: replaces broken JS querySelector('.menu-item') — pure CSS toggle */
  #menu-toggle-cb:checked ~ .menu-items {
    display: block;
  }

  .menu-items li {
    background-color: #222222;
    color: #F7F7F7;
    padding: 10px;
    border-radius: 5px;
    margin: 10px 0;
    text-align: center;
    font-size: 1.1em;
    box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.5);
  }

  .menu-toggle-label {
    color: #FFCC00;
    font-size: 2em;
    margin-bottom: 20px;
    cursor: pointer;
    display: block;
    user-select: none;
  }

  .menu-toggle-label:hover {
    color: #FF9933;
  }

  /* Right column: solid dark stand-in since external URLs are blocked in this sandbox */
  /* FIX 1: the original CSS had a missing closing ) on the url() value               */
  .image-container {
    background-color: #1a0a00;
    background-size: cover;
    background-position: center;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .image-placeholder {
    color: rgba(255, 255, 255, 0.15);
    font-size: 1em;
    text-align: center;
    padding: 20px;
  }
</style>
</head>
<body>

<div class="content">
  <div class="header-container">
    <h1>Welcome to the<br />Roast Toast Coast Cafe!</h1>
    <p>Where flavor meets the shore!</p>
  </div>

  <section class="menu-section">
    
    <input type="checkbox" id="menu-toggle-cb" />
    <label class="menu-toggle-label">Our Menu ▾</label>
    <ul class="menu-items">
      <li>Breezy Brews</li>
      <li>Toasty Delights</li>
      <li>Coastal Bites</li>
      <li>Sunset Sips</li>
    </ul>
  </section>
</div>

<div class="image-container">
  <p class="image-placeholder">
    Cafe photo loads here<br />
    <small>(external images blocked in sandbox;<br />original URL is correct in the source)</small>
  </p>
</div>

<p style="text-align:center;font-size:12px;color:#57606a;border-top:1px solid #e5e7eb;padding:8px 0;margin:0;grid-column:1/-1">Made with IBM Bob</p>
</body>
</html>
